name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/bundle.js
      - run: git diff --exit-code -- dist/ || (echo "dist/ is out of date — run: node tools/bundle.js" && exit 1)
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: lovelace
