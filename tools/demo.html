<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Victron Remote Console card — demo harness</title>
<style>
  body { background: #1c1c1c; color: #fff; font-family: Roboto, Noto, sans-serif; margin: 0; padding: 16px; }
  ha-card { display:block; background:#2d2d2d; border-radius: 12px; max-width: 900px; margin: 0 auto; }
  .hint { color:#9c9c9c; max-width: 900px; margin: 8px auto 20px auto; font-size: .85rem; }
</style>
</head>
<body>
<div class="hint">Rendered with mocked hass states — harness for visual verification.</div>
<ha-card id="card-holder"></ha-card>
<script type="module" src="../dist/victron-remote-console.js"></script>
<script type="module">
const STATES = {
  "sensor.battery_soc": { state: "55", attributes: { unit_of_measurement: "%" } },
  "sensor.battery_power": { state: "-862", attributes: { unit_of_measurement: "W" } },
  "sensor.battery_voltage": { state: "52.55", attributes: { unit_of_measurement: "V" } },
  "sensor.battery_current": { state: "-16.4", attributes: { unit_of_measurement: "A" } },
  "sensor.battery_time_to_go": { state: "1267", attributes: { unit_of_measurement: "min" } },
  "sensor.ac_input_power": { state: "34", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_input_l1": { state: "-73", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_input_l2": { state: "-200", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_input_l3": { state: "218", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_input_source": { state: "Grid" },
  "sensor.solar_power": { state: "-6", attributes: { unit_of_measurement: "W" } },
  "sensor.solar_l1": { state: "-2", attributes: { unit_of_measurement: "W" } },
  "sensor.solar_l2": { state: "-2", attributes: { unit_of_measurement: "W" } },
  "sensor.solar_l3": { state: "-2", attributes: { unit_of_measurement: "W" } },
  "sensor.inverter_state": { state: "Discharging" },
  "sensor.ac_loads_power": { state: "24", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_l1": { state: "23", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_l2": { state: "11", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_l3": { state: "0", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_critical_power": { state: "704", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_critical_l1": { state: "154", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_critical_l2": { state: "49", attributes: { unit_of_measurement: "W" } },
  "sensor.ac_loads_critical_l3": { state: "505", attributes: { unit_of_measurement: "W" } },
};
const HASS = {
  locale: { language: "en" },
  states: STATES,
};
const CONFIG = {
  type: "custom:victron-remote-console-card",
  view: "overview",
  title: "",
  elements: {
    battery_soc: "sensor.battery_soc",
    battery_power: "sensor.battery_power",
    battery_voltage: "sensor.battery_voltage",
    battery_current: "sensor.battery_current",
    battery_time_to_go: "sensor.battery_time_to_go",
    ac_input_power: "sensor.ac_input_power",
    ac_input_l1: "sensor.ac_input_l1",
    ac_input_l2: "sensor.ac_input_l2",
    ac_input_l3: "sensor.ac_input_l3",
    ac_input_source: "sensor.ac_input_source",
    solar_power: "sensor.solar_power",
    solar_l1: "sensor.solar_l1",
    solar_l2: "sensor.solar_l2",
    solar_l3: "sensor.solar_l3",
    inverter_state: "sensor.inverter_state",
    ac_loads_power: "sensor.ac_loads_power",
    ac_loads_l1: "sensor.ac_loads_l1",
    ac_loads_l2: "sensor.ac_loads_l2",
    ac_loads_l3: "sensor.ac_loads_l3",
    ac_loads_critical_power: "sensor.ac_loads_critical_power",
    ac_loads_critical_l1: "sensor.ac_loads_critical_l1",
    ac_loads_critical_l2: "sensor.ac_loads_critical_l2",
    ac_loads_critical_l3: "sensor.ac_loads_critical_l3",
  },
  invert: [],
  show_connectors: true,
};

const card = document.createElement("custom:victron-remote-console-card".replace("custom:",""));
card.setConfig(CONFIG);
card.hass = HASS;
document.getElementById("card-holder").appendChild(card);
window._vrc = { card, CONFIG, HASS };
</script>
</body>
</html>
